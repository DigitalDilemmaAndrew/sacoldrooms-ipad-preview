<title>SA Coldrooms Quoting (iPad prototype)</title>
<style>
:root{--ink:#031427;--mut:#4d5765;--line:#e5e5e5;--bg:#f6f8fb;--card:#fff;--pri:#1e73be;--pri2:#e7f5fc;--sky:#43aee1;--org:#f69d1d;--ok:#11823b;--warn:#b45309;--warnbg:#fff7e6;--bad:#b42318;--r:14px;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);--sal:env(safe-area-inset-left);--sar:env(safe-area-inset-right)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}input,select,textarea{font-size:16px!important}#sk canvas{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}.sk,.sktools,.skinsp b{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.sitemap{height:220px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#e8eef5;position:relative}
.sitemap .leaflet-container{height:100%;width:100%;font:inherit}
.sitemap .gmap{height:100%;width:100%}
.sitemap .off{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center;color:var(--mut);background:#e8eef5;z-index:2}
.sitewrap{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:1100px){.sitewrap{grid-template-columns:1.2fr .8fr}}
.sugs{position:relative}.sugs ul{position:absolute;left:0;right:0;top:100%;z-index:20;background:#fff;border:1px solid var(--line);border-radius:12px;margin:4px 0 0;padding:4px;list-style:none;max-height:240px;overflow:auto;box-shadow:0 8px 24px rgba(3,20,39,.12)}
.sugs li{min-height:44px;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:15px}.sugs li:active,.sugs li.on{background:var(--pri2)}
.pinbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px}
.prov{font-size:12px;color:var(--mut)}.prov b{color:var(--ink)}
.pinmark{width:28px;height:28px;border-radius:50% 50% 50% 0;background:#1e73be;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.preview-map{height:180px;border-radius:8px;overflow:hidden;border:1px solid var(--line);margin:8px 0}
.stbanner{grid-column:1/-1;position:sticky;top:0;z-index:60;background:#fff7e6;color:#7a3e00;border-bottom:1px solid #f69d1d;padding:10px 14px;font-size:14px}button,a,.seg button{touch-action:manipulation}
.app{min-height:100vh;padding-bottom:calc(190px + var(--sab));padding-left:var(--sal);padding-right:var(--sar)}
header.top{display:flex;align-items:center;gap:10px;padding:calc(8px + var(--sat)) 16px 8px;background:#031427;color:#fff;border-bottom:3px solid var(--sky);position:sticky;top:0;z-index:8}
header.top img{width:40px;height:40px;object-fit:contain;background:#fff;border-radius:8px;padding:2px}
header.top .t{font-weight:700}header.top .s{font-size:12px;color:#b9d9ee}
.proto{margin-left:auto;font-size:12px;background:var(--warnbg);color:var(--warn);padding:4px 10px;border-radius:999px;white-space:nowrap}
main{padding:16px;max-width:780px;margin:0 auto}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:17px;margin:18px 0 8px}h3{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.sp{justify-content:space-between}.wrapr{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
label.f{display:block;font-size:13px;color:var(--mut);margin-bottom:10px}
label.f input,label.f select,label.f textarea,.inp{display:block;width:100%;margin-top:4px;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px;color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;background:#e9eef5;border-radius:12px;padding:4px;gap:4px;margin-bottom:10px}
.seg button{flex:1 1 auto;min-height:44px;min-width:64px;border:0;border-radius:9px;background:transparent;font-weight:600;padding:0 10px}
.seg button.on{background:#fff;color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btn{min-height:48px;min-width:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:600;cursor:pointer}
.btn.pri{font-weight:700;background:var(--pri);color:#fff;border-color:var(--pri)}.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.sm{min-height:44px;padding:0 14px;font-size:15px}.btn.ghost{border-color:transparent;background:transparent;color:var(--pri)}
.btn.danger{color:var(--bad)}.btn.org{background:var(--org);border-color:var(--org);color:#031427;font-weight:700}
.chk{display:flex;align-items:center;gap:10px;min-height:44px}.chk input{width:26px;height:26px}
.pill{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;font-weight:600}
.st-draft{background:#eef1f5;color:#475467}.st-sent{background:var(--pri2);color:var(--pri)}.st-accepted{background:#e7f6ec;color:var(--ok)}
.flag{display:inline-block;font-size:12px;padding:2px 7px;border-radius:6px;background:var(--warnbg);color:var(--warn);font-weight:600;border:1px solid var(--org)}
.demo{background:#fdecc8;color:#7a4b00;border:1px solid var(--org)}
.mut{color:var(--mut);font-size:13px}.num{font-variant-numeric:tabular-nums;text-align:right}
.qitem{display:flex;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;min-height:56px}.qitem:first-child{border-top:0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}.kpi b{display:block;font-size:18px}.kpi span,.kpi small{font-size:12px;color:var(--mut);display:block}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}th{text-align:left;color:var(--mut);font-weight:600;font-size:12px}
.line{padding:10px 0;border-top:1px solid var(--line)}.line:first-child{border-top:0}
.line .amt{width:120px;min-height:44px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;text-align:right}
.line .amt.ov{border-color:var(--warn);background:var(--warnbg)}
.bar{position:fixed;left:0;right:0;bottom:calc(64px + var(--sab));background:#fff;border-top:1px solid var(--line);padding:8px 16px;display:flex;gap:10px;align-items:center;z-index:6}
.bar .tot{flex:1;min-width:0}.bar .tot b{font-size:18px;display:block}.bar .tot span{font-size:12px;color:var(--mut)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(64px + var(--sab));background:#fff;border-top:1px solid var(--line);display:flex;z-index:7;padding-bottom:var(--sab)}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--mut);text-decoration:none;gap:2px}
nav.tabs a.on{color:var(--pri);font-weight:700}nav.tabs a i{font-style:normal;font-size:20px}
.steps{display:flex;gap:4px;margin-bottom:12px}.steps button{flex:1;height:44px;border:0;background:transparent;padding:0;display:flex;align-items:center}.steps button i{display:block;width:100%;height:6px;border-radius:3px;background:var(--line)}.steps button.on i{background:var(--sky)}
.cut td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.doc{background:#fff;border:1px solid var(--line);border-radius:6px;padding:24px;font-size:14px}
.doc .hd{display:flex;gap:12px;align-items:center;border-bottom:2px solid var(--pri);padding-bottom:10px;margin-bottom:12px}.doc .hd img{width:64px}
.doc img.sk{width:100%;max-height:420px;object-fit:contain;border:1px solid var(--line);border-radius:6px;background:#fff}
.photos{display:flex;flex-wrap:wrap;gap:8px}.photos figure{margin:0;position:relative}.photos img{width:120px;height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.photos figure button{position:absolute;top:-8px;right:-8px;width:44px;height:44px;border-radius:22px;border:0;background:transparent;display:flex;align-items:flex-start;justify-content:flex-end;padding:0}.photos figure button span{width:24px;height:24px;border-radius:12px;background:var(--bad);color:#fff;font-size:14px;line-height:24px;text-align:center;display:block}
.filebtn{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1px dashed var(--pri);border-radius:12px;color:var(--pri);font-weight:600;cursor:pointer}.filebtn input{display:none}
.modal{position:fixed;inset:0;background:rgba(15,27,45,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal .sheet{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:20px 20px calc(20px + var(--sab))}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(80px + var(--sat));background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:30;max-width:90vw}
.side,.qp{display:none}
.sq{border-top:1px solid var(--line);padding:10px 0}.sq:first-of-type{border-top:0}.sq .q{font-weight:600;margin-bottom:6px}
.sq .res{font-size:13px;margin-top:4px}.add{background:var(--pri2);color:var(--pri);border:1px solid var(--sky)}
/* sketch */
.sk{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sktools{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border-bottom:1px solid var(--line);background:#fafcfe}
.sktools button{min-height:44px;min-width:48px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:4px}
.sktools button.on{background:var(--pri);color:#fff;border-color:var(--pri)}.sktools .sepr{width:1px;background:var(--line);margin:0 2px}
.sktools button.tg.on{background:var(--pri2);color:var(--pri);border-color:var(--sky)}
.skarea{position:relative;height:55vh;min-height:340px;background:#fff}
.skarea canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;display:block}
.skinsp{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px;border-top:1px solid var(--line);min-height:62px;background:#fafcfe}
.skinsp input{min-height:44px;width:120px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;font-size:16px}
.skinsp .lab{font-size:13px;color:var(--mut)}
.skhint{position:absolute;left:10px;bottom:10px;font-size:12px;color:var(--mut);background:rgba(255,255,255,.85);padding:4px 8px;border-radius:6px;pointer-events:none}
@media(min-width:960px){
 .app{display:grid;grid-template-columns:200px minmax(0,1fr);padding-bottom:0}
 header.top{grid-column:1/-1}
 .side{display:block;background:#fff;border-right:1px solid var(--line);padding:12px;position:sticky;top:calc(64px + var(--sat));height:calc(100vh - 64px - var(--sat));overflow:auto}
 .side a{display:flex;align-items:center;min-height:48px;padding:0 14px;border-radius:10px;color:var(--ink);text-decoration:none;margin-bottom:4px;font-weight:600}.side a.on{background:var(--pri2);color:var(--pri)}
 .side .ver{font-size:11px;color:var(--mut);padding:12px 6px}
 nav.tabs,.bar{display:none}main{max-width:none;width:100%;padding:18px 22px 40px}
 .wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
 .qp{display:block;position:sticky;top:calc(80px + var(--sat))}
 .qp .card{margin:0}.qp .big{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
 .qp .stp{display:block;width:100%;text-align:left;min-height:44px;border:0;background:transparent;border-radius:10px;padding:0 10px;font-weight:600;color:var(--mut)}.qp .stp.on{background:var(--pri2);color:var(--pri)}
 .kpis{grid-template-columns:repeat(3,1fr)}.dgrid{display:grid;grid-template-columns:2fr 1fr;gap:16px}
 .modal{align-items:center}.modal .sheet{border-radius:18px}
 .skarea{height:calc(100vh - 330px);height:calc(100dvh - 330px);min-height:420px}
}
@media(min-width:1300px){.wrap{grid-template-columns:minmax(0,1fr) 320px}}
@media print{header.top,nav.tabs,.bar,.side,.qp,.noprint{display:none!important}.app{display:block;padding:0}main{max-width:none;padding:0}.wrap{display:block}}

 if(d.q){q[d.q]=t.type==='checkbox'?v:t.type==='number'?num(v):v;if(['street','suburb','state','postcode'].includes(d.q)){q.site=[q.street,q.suburb,q.state,q.postcode].filter(Boolean).join(', ');const iq=document.getElementById('siteq');if(iq)iq.value=q.site}save();if(commit&&['room','panel','floor','L','W','H','panelWidth','markup','useSk'].includes(d.q)){const y=scrollY;render();scrollTo(0,y)}else refreshPanel();return}
 if(d.door){const dr=q.doors.find(x=>x.id===d.door);dr[d.k]=t.type==='checkbox'?v:num(v);save();if(commit){const y=scrollY;render();scrollTo(0,y)}else liveTotal();return}
 if(d.free){const r=q[d.free].find(x=>x.id===d.id);r[d.k]=d.k==='amt'?num(v):v;save();if(commit)refreshPanel();else liveTotal();return}
 if(d.lab){const l=q.labour.find(x=>x.id===d.lab);l[d.k]=d.k==='type'?v:num(v);save();if(commit){const y=scrollY;render();scrollTo(0,y)}else liveTotal();return}
 if(d.ov){const n=num(v);if(n==null)delete q.ov[d.ov];else q.ov[d.ov]=n;save();if(commit){const y=scrollY;render();scrollTo(0,y)}else liveTotal();return}
 if(d.it){const i=item(d.it);if(d.k==='mk'){const m=num(v);if(m!=null&&i.cost!=null)i.sell=Math.round(i.cost*(1+m/100)*100)/100}else if(d.k==='cost'||d.k==='sell')i[d.k]=num(v);else i[d.k]=v;save();if(commit){const y=scrollY;render();scrollTo(0,y)}return}
 if(d.lt){const l=S.labour.find(x=>x.id===d.lt);l[d.k]=d.k==='name'?v:num(v);save();if(commit){const y=scrollY;render();scrollTo(0,y)}return}
 if('gst'in d){S.gst=num(v)??0;save();return}
 if('mapskey'in d){S.mapsKey=v;save();if(commit)toast(v.trim()?'Google Maps key saved. Open a quote Customer step to use it.':'Key cleared. Using OpenStreetMap + Nominatim.');return}
 if(t.id==='psearch'){R.q=v;if(commit){render();const s=document.getElementById('psearch');s.focus()}}}
document.addEventListener('input',e=>onField(e,false));document.addEventListener('change',e=>onField(e,true));
window.addEventListener('pagehide',()=>{if(SK.on){const q=SK.q;if(q){q.skPng=q.sk.shapes.length?SK.png():'';save()}}});
const LF=()=>window.L;
// ---------- Site map + address lookup (Google when keyed, else Leaflet/Nominatim) ----------
const GEO={on:false,map:null,marker:null,gmap:null,gmarker:null,gac:null,mode:'none',q:null,timer:null,abort:null,el:null};
GEO.provider=function(){return (S.mapsKey&&S.mapsKey.trim())?'google':'nominatim'};
GEO.label=function(){return GEO.provider()==='google'?'Google Maps / Places':'OpenStreetMap + Nominatim (no key set)'};
GEO.mount=function(q){const root=document.getElementById('sitemap');if(!root)return;this.q=q;this.on=true;this.el=root;this.renderShell();
 if(this.provider()==='google')this.mountGoogle();else this.mountLeaflet()};
GEO.unmount=function(){this.on=false;try{if(this.timer)clearTimeout(this.timer)}catch(_){}
 try{if(this.abort)this.abort.abort()}catch(_){}
 try{if(this.map){this.map.remove();this.map=null;this.marker=null}}catch(_){}
 try{if(this.gmap){google.maps.event.clearInstanceListeners(this.gmap);this.gmap=null;this.gmarker=null;this.gac=null}}catch(_){}
 this.el=null;this.q=null};
GEO.renderShell=function(){const q=this.q,root=this.el;if(!root)return;
 root.innerHTML=`<div class="sitewrap">
  <div><div class="row" style="gap:8px;align-items:end;margin-bottom:8px"><label class="f" style="flex:1;margin:0">Site address<div class="sugs"><input id="siteq" type="text" autocomplete="off" placeholder="Street, suburb, state (AU)" value="${esc(q.site||'')}" style="width:100%"><ul id="siteul" hidden></ul></div></label>
  <button type="button" class="btn pri" id="sitesearch" style="flex:0;white-space:nowrap">Search</button>
  <button type="button" class="btn pinbtn" id="sitepin" title="Use my location" aria-label="Use my location">📍 Use my location</button></div>
  <p class="mut" style="margin-top:-4px">Type an address, then tap <b>Search</b> (Nominatim policy: no autocomplete). Results are cached on this device.</p>
  <div class="grid2"><label class="f">Street<input data-q="street" value="${esc(q.street||'')}"></label><label class="f">Suburb<input data-q="suburb" value="${esc(q.suburb||'')}"></label><label class="f">State<input data-q="state" value="${esc(q.state||'SA')}"></label><label class="f">Postcode<input data-q="postcode" inputmode="numeric" value="${esc(q.postcode||'')}"></label></div>
  <p class="prov">Lookup: <b>${esc(GEO.label())}</b>${GEO.provider()==='nominatim'?' · Google Places is off until a key is saved in Labour &amp; GST.':''} Map data © OpenStreetMap contributors.</p></div>
  <div><div class="sitemap" id="sitemape"><div id="mapcanvas" style="height:100%;width:100%"></div><div class="off" id="mapoff">Loading map…</div></div>
  <p class="mut" id="geostatus" style="margin-top:6px">${q.lat!=null?`Pin: ${(+q.lat).toFixed(5)}, ${(+q.lng).toFixed(5)}`:'No pin yet. Search, or tap Use my location.'}</p></div></div>`;
 root.querySelector('#siteq').addEventListener('input',e=>{const q=GEO.q;if(q){q.site=e.target.value;save()}});
 root.querySelector('#siteq').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();GEO.searchBtn()}if(e.key==='Escape')GEO.hideSug()});
 root.querySelector('#sitesearch').addEventListener('click',()=>GEO.searchBtn());
 root.querySelector('#sitepin').addEventListener('click',()=>GEO.locate());
 root.addEventListener('click',e=>{const li=e.target.closest('[data-sug]');if(!li)return;GEO.pickSug(+li.dataset.sug)})};
GEO.setStatus=function(m){const el=document.getElementById('geostatus');if(el)el.textContent=m};
GEO.showOff=function(m){const el=document.getElementById('mapoff');if(el){el.hidden=false;el.textContent=m}};
GEO.hideOff=function(){const el=document.getElementById('mapoff');if(el)el.hidden=true};
GEO.applyAddr=function(a){const q=this.q;if(!q)return;
 q.street=a.street||q.street||'';q.suburb=a.suburb||'';q.state=a.state||'SA';q.postcode=a.postcode||'';
 q.lat=a.lat!=null?+a.lat:q.lat;q.lng=a.lng!=null?+a.lng:q.lng;
 q.site=[q.street,q.suburb,q.state,q.postcode].filter(Boolean).join(', ');
 const iq=document.getElementById('siteq');if(iq)iq.value=q.site;
 ['street','suburb','state','postcode'].forEach(k=>{const i=document.querySelector('[data-q="'+k+'"]');if(i)i.value=q[k]||''});
 save();this.setStatus(q.lat!=null?`Pin: ${(+q.lat).toFixed(5)}, ${(+q.lng).toFixed(5)}`:'');this.setMarker(q.lat,q.lng)};
GEO.setMarker=function(lat,lng){if(lat==null||lng==null||isNaN(lat)||isNaN(lng))return;
 if(this.mode==='leaflet'&&this.map){const ll=[+lat,+lng];if(!this.marker){this.marker=LF().marker(ll,{draggable:true,icon:LF().divIcon({className:'',html:'<div class="pinmark"></div>',iconSize:[28,28],iconAnchor:[14,28]})}).addTo(this.map);this.marker.on('dragend',()=>{const p=this.marker.getLatLng();GEO.reverse(p.lat,p.lng)})}else this.marker.setLatLng(ll);this.map.setView(ll,Math.max(this.map.getZoom(),16))}
 if(this.mode==='google'&&this.gmap){const ll={lat:+lat,lng:+lng};if(!this.gmarker){this.gmarker=new google.maps.Marker({map:this.gmap,position:ll,draggable:true});this.gmarker.addListener('dragend',()=>{const p=this.gmarker.getPosition();GEO.reverse(p.lat(),p.lng())})}else this.gmarker.setPosition(ll);this.gmap.setCenter(ll);this.gmap.setZoom(Math.max(this.gmap.getZoom()||16,16))}};
GEO.mountLeaflet=function(){if(typeof LF()==='undefined'||!LF().map){this.mode='none';this.showOff('Map unavailable (Leaflet not loaded). Type the address below.');return}
 this.mode='leaflet';const box=document.getElementById('mapcanvas')||document.getElementById('sitemape');
 try{this.map=LF().map(box,{zoomControl:true,attributionControl:true}).setView(this.q.lat!=null?[this.q.lat,this.q.lng]:[-34.9285,138.6007],this.q.lat!=null?16:11);
  const tiles=LF().tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
  let ok=false,to=setTimeout(()=>{if(!ok)GEO.showOff('Map tiles unavailable offline. Type the address, or check the network.')},4000);
  tiles.on('load',()=>{ok=true;clearTimeout(to);GEO.hideOff()});
  tiles.on('tileerror',()=>{});
  tiles.addTo(this.map);this.hideOff();if(this.q.lat!=null)this.setMarker(this.q.lat,this.q.lng);
  setTimeout(()=>{try{this.map.invalidateSize()}catch(_){}},80)}catch(e){this.mode='none';this.showOff('Map unavailable. Type the address.')}};
GEO.loadGoogle=function(){const key=(S.mapsKey||'').trim();return new Promise((res,rej)=>{
 if(window.google&&google.maps&&google.maps.places)return res();
 if(!key)return rej(new Error('no key'));
 const id='gmaps-js';const old=document.getElementById(id);if(old)old.remove();
 const s=document.createElement('script');s.id=id;s.async=true;
 s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(key)+'&libraries=places&loading=async';
 s.onload=()=>res();s.onerror=()=>rej(new Error('Google Maps failed to load'));document.head.appendChild(s)})};
GEO.mountGoogle=function(){this.loadGoogle().then(()=>{
  if(!this.on)return;this.mode='google';const wrap=document.getElementById('sitemape');const box=document.getElementById('mapcanvas')||wrap;box.innerHTML='';const off=document.getElementById('mapoff');if(off)off.hidden=true;
  const center=this.q.lat!=null?{lat:+this.q.lat,lng:+this.q.lng}:{lat:-34.9285,lng:138.6007};
  this.gmap=new google.maps.Map(box,{center,zoom:this.q.lat!=null?16:11,mapTypeControl:false,streetViewControl:false,fullscreenControl:false});
  if(this.q.lat!=null)this.setMarker(this.q.lat,this.q.lng);
  const input=document.getElementById('siteq');
  this.gac=new google.maps.places.Autocomplete(input,{componentRestrictions:{country:'au'},fields:['address_components','formatted_address','geometry'],bounds:new google.maps.LatLngBounds({lat:-35.2,lng:138.3},{lat:-34.6,lng:139.0})});
  this.gac.addListener('place_changed',()=>{const p=this.gac.getPlace();if(!p||!p.geometry)return;GEO.fromGooglePlace(p)});
  this.hideOff()}).catch(()=>{this.showOff('Google Maps could not load. Falling back to OpenStreetMap.');this.mountLeaflet()})};
GEO.fromGooglePlace=function(p){const c={};(p.address_components||[]).forEach(x=>x.types.forEach(t=>c[t]=x.long_name||x.short_name));
 const street=[c.street_number,c.route].filter(Boolean).join(' ');
 const suburb=c.locality||c.sublocality||c.postal_town||'';
 const state=(c.administrative_area_level_1||'SA').replace('South Australia','SA');
 const postcode=c.postal_code||'';
 const lat=p.geometry.location.lat(),lng=p.geometry.location.lng();
 this.applyAddr({street,suburb,state,postcode,lat,lng});document.getElementById('siteul').hidden=true};
GEO.hideSug=function(){const u=document.getElementById('siteul');if(u){u.hidden=true;u.innerHTML=''}};
GEO._cache=GEO._cache||{};GEO._lastReq=0;
GEO.searchBtn=function(){if(this.provider()==='google'){toast('With a Google key, use the Google suggestions in the field.');return}
 const v=(document.getElementById('siteq')||{}).value||'';if(!v||v.trim().length<3){toast('Enter at least 3 characters, then Search.');return}
 this.search(v.trim())};
GEO.search=function(v){const key='s:'+v.toLowerCase();
 if(GEO._cache[key]){GEO.showResults(GEO._cache[key]);return}
 const wait=Math.max(0,1100-(Date.now()-(GEO._lastReq||0)));
 clearTimeout(this.timer);this.timer=setTimeout(()=>GEO._doSearch(v,key),wait)};
GEO._doSearch=function(v,key){if(this.abort)try{this.abort.abort()}catch(_){}
 this.abort=new AbortController();GEO._lastReq=Date.now();GEO.setStatus('Searching…');
 const url='https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&countrycodes=au&limit=6&q='+encodeURIComponent(v);
 fetch(url,{headers:{'Accept':'application/json'},signal:this.abort.signal}).then(r=>{if(!r.ok)throw new Error('search');return r.json()}).then(rows=>{
  GEO._cache[key]=rows||[];GEO.showResults(GEO._cache[key])}).catch(e=>{if(e.name==='AbortError')return;GEO.setStatus('Address lookup unavailable offline. Type the address manually.');GEO.hideSug()})};
GEO.showResults=function(rows){GEO._sug=rows||[];const ul=document.getElementById('siteul');if(!ul)return;
 if(!GEO._sug.length){ul.hidden=false;ul.innerHTML='<li class="mut">No Australian matches</li>';GEO.setStatus('No matches. Edit the fields manually.');return}
 ul.hidden=false;ul.innerHTML=GEO._sug.map((r,i)=>`<li data-sug="${i}" role="option">${esc(r.display_name)}</li>`).join('');GEO.setStatus(GEO._sug.length+' result(s). Tap one to place the pin.')};
GEO.pickSug=function(i){const r=(this._sug||[])[i];if(!r)return;this.hideSug();
 const a=r.address||{};
 const street=[a.house_number,a.road||a.pedestrian||a.residential].filter(Boolean).join(' ')||(r.display_name||'').split(',')[0];
 const suburb=a.suburb||a.city_district||a.town||a.village||a.city||'';
 const state=(a.state||a.state_code||'SA').replace('South Australia','SA');
 const postcode=a.postcode||'';
 this.applyAddr({street,suburb,state,postcode,lat:+r.lat,lng:+r.lon})};
GEO.parseNom=function(r){const a=r.address||{};
 return{street:[a.house_number,a.road||a.pedestrian||a.residential].filter(Boolean).join(' '),suburb:a.suburb||a.city_district||a.town||a.village||a.city||'',state:(a.state||'SA').replace('South Australia','SA'),postcode:a.postcode||'',lat:+r.lat,lng:+r.lon}};
GEO.reverse=function(lat,lng){lat=+lat;lng=+lng;this.q.lat=lat;this.q.lng=lng;save();const ckey='r:'+lat.toFixed(5)+','+lng.toFixed(5);if(GEO._cache[ckey]){const a=GEO._cache[ckey];a.lat=lat;a.lng=lng;return GEO.applyAddr(a)}this.setStatus(`Pin: ${lat.toFixed(5)}, ${lng.toFixed(5)} · looking up address…`);
 if(this.provider()==='google'&&window.google&&google.maps){
  const geocoder=new google.maps.Geocoder();geocoder.geocode({location:{lat,lng},region:'AU'},(res,st)=>{
   if(st!=='OK'||!res||!res[0]){GEO.setStatus(`Pin: ${lat.toFixed(5)}, ${lng.toFixed(5)} · address not found`);return}
   GEO.fromGooglePlace({address_components:res[0].address_components,formatted_address:res[0].formatted_address,geometry:{location:{lat:()=>lat,lng:()=>lng}}})});return}
 fetch('https://nominatim.openstreetmap.org/reverse?format=json&addressdetails=1&lat='+lat+'&lon='+lng,{headers:{'Accept':'application/json'}}).then(r=>{if(!r.ok)throw new Error('rev');return r.json()}).then(r=>{
  const a=GEO.parseNom(r);a.lat=lat;a.lng=lng;GEO._cache['r:'+lat.toFixed(5)+','+lng.toFixed(5)]=a;GEO.applyAddr(a)}).catch(()=>GEO.setStatus(`Pin: ${lat.toFixed(5)}, ${lng.toFixed(5)} · reverse lookup unavailable. Enter the address manually.`))};
GEO.locate=function(){if(!navigator.geolocation){toast('This device has no location services.');this.setStatus('Location unavailable. Type the address or drop a pin by searching.');return}
 this.setStatus('Getting your location…');
 navigator.geolocation.getCurrentPosition(pos=>{
  const lat=pos.coords.latitude,lng=pos.coords.longitude;GEO.setMarker(lat,lng);GEO.reverse(lat,lng)},err=>{
  const why=err&&err.code===1?'Location permission denied':err&&err.code===2?'Location unavailable':err&&err.code===3?'Location timed out':'Location failed';
  const file=/^file:/.test(location.protocol)?' Safari often blocks location on files opened from the Files app (file://). Open via a local web server, or type the address.':'';
  toast(why+'. You can still type the address.');GEO.setStatus(why+'.'+file)},{enableHighAccuracy:true,timeout:12000,maximumAge:0})};
GEO.previewHtml=function(q){if(q.lat==null||q.lng==null)return'';
 const label=esc([q.street,q.suburb,q.state,q.postcode].filter(Boolean).join(', ')||q.site||'');
 if(typeof L!=='undefined')return`<div class="preview-map" id="prevmap" data-lat="${q.lat}" data-lng="${q.lng}"></div><p class="mut">${label}</p>`;
 return`<p><b>Site pin:</b> ${(+q.lat).toFixed(5)}, ${(+q.lng).toFixed(5)} · ${label}</p>`};
GEO.mountPreview=function(){const el=document.getElementById('prevmap');if(!el||typeof LF()==='undefined'||!LF().map)return;
 const lat=+el.dataset.lat,lng=+el.dataset.lng;const m=LF().map(el,{zoomControl:false,dragging:false,scrollWheelZoom:false,attributionControl:true}).setView([lat,lng],16);
 LF().tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OSM'}).addTo(m);
 LF().marker([lat,lng],{icon:LF().divIcon({className:'',html:'<div class="pinmark"></div>',iconSize:[28,28],iconAnchor:[14,28]})}).addTo(m);
 setTimeout(()=>{try{m.invalidateSize()}catch(_){}},60)};

render();
